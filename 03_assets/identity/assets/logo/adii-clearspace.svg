<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-labelledby="cs-title cs-desc" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="cs-title">ADII clear space</title>
  <desc id="cs-desc">The horizontal lockup surrounded by clear space equal to one quarter of the symbol height on all four sides.</desc>

  <rect width="420" height="200" fill="#ffffff"/>

  <!-- clear space boundary: 16px at 2x scale = 8 design units = 1/4 of the 32-unit symbol height -->
  <rect x="52" y="52" width="276" height="96" fill="#eef1f2"/>
  <rect x="52" y="52" width="276" height="96" fill="none" stroke="#78868e" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- lockup at 2x, ink bounds x 68..296, y 68..132 -->
  <g transform="translate(60 60) scale(2)" fill="#131a1f">
    <rect x="4" y="4" width="4" height="24"/><rect x="4" y="12" width="24" height="4"/>
    <rect x="12" y="20" width="4" height="8"/><rect x="18" y="24" width="4" height="4"/>
    <rect x="24" y="20" width="4" height="8"/>
    <g transform="translate(42 0)" fill="none" stroke="#131a1f" stroke-width="4" stroke-linecap="butt" stroke-miterlimit="4">
      <path d="M4 26 L13 6 H17 L26 26"/><path d="M9.4 14 H20.6"/>
      <path d="M36 4 V28"/><path d="M36 6 H46 A10 10 0 0 1 46 26 H36"/>
      <path d="M65 4 V28"/><path d="M76 4 V28"/>
    </g>
  </g>

  <!-- x measure: top-left -->
  <g stroke="#4a3ab5" stroke-width="1.5">
    <path d="M60 44 H68"/>
    <path d="M60 41 V47"/>
    <path d="M68 41 V47"/>
    <path d="M44 68 V76"/>
    <path d="M41 68 H47"/>
    <path d="M41 76 H47"/>
  </g>
  <text x="64" y="36" font-size="11" fill="#4a3ab5" text-anchor="middle">x</text>
  <text x="34" y="76" font-size="11" fill="#4a3ab5" text-anchor="end">x</text>

  <text x="52" y="172" font-size="12" fill="#131a1f">Clear space x = one quarter of the symbol height (8 of 32 design units).</text>
  <text x="52" y="188" font-size="12" fill="#465059">Keep x clear on all four sides. No type, rule or image enters the dashed area.</text>
</svg>
