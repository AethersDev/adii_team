<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADII — Run Inspector</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="brand" href="/" title="Back to the walkthrough"><span class="glyph">◆</span>ADII</a><span class="eyebrow">Run inspector</span>
  <nav class="runs" id="runs" role="tablist" aria-label="Example runs"></nav>
  <div class="spacer"></div>
  <div class="tabs" role="tablist" aria-label="View">
    <button id="tab-run"  role="tab" aria-selected="true">RUN RECORD</button>
    <button id="tab-eval" role="tab" aria-selected="false">EVALUATION</button>
  </div>
  <button id="theme" title="Toggle light and dark">◐</button>
</header>

<main>
  <aside>
    <div class="eyebrow">Investigation trace</div>
    <ul class="steps" id="steps"></ul>
  </aside>
  <article id="view"></article>
</main>

<footer id="foot"></footer>
<script src="/app.js"></script>
</body>
</html>
